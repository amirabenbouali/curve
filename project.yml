name: Curve
options:
  bundleIdPrefix: com.curve.app
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  FirebaseSDK:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 7.1.0

targets:
  Curve:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Curve
        excludes:
          - "**/.DS_Store"
    info:
      path: Curve/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleDisplayName: Curve
        # TODO once GoogleService-Info.plist is added: replace REPLACE_WITH_REVERSED_CLIENT_ID
        # below with the plist's REVERSED_CLIENT_ID value, so Google Sign-In's browser
        # redirect can find its way back into the app.
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - REPLACE_WITH_REVERSED_CLIENT_ID
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.curve.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: NO
    dependencies:
      - package: FirebaseSDK
        product: FirebaseAuth
      - package: FirebaseSDK
        product: FirebaseFirestore
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
    schemes:
      Curve:
        build:
          targets:
            Curve: all
        run:
          config: Debug
        test:
          config: Debug
