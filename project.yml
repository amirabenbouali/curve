name: Curve
options:
  bundleIdPrefix: com.curve.app
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Curve:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Curve
        excludes:
          - "**/.DS_Store"
    info:
      path: Curve/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleDisplayName: Curve
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.curve.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: NO
    schemes:
      Curve:
        build:
          targets:
            Curve: all
        run:
          config: Debug
        test:
          config: Debug
